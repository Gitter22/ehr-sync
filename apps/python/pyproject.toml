[project]
name = "ehr-sync-python"
version = "0.1.0"
description = "EHR Sync Python service — future Oracle sandbox integration"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.32.1",
    "httpx>=0.28.1",
    "asyncpg>=0.30.0",
    "pydantic-settings>=2.6.1",
]

[dependency-groups]
dev = [
    "ruff>=0.8.3",
    "mypy>=1.13.0",
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true
