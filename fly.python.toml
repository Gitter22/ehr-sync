# Fly.io app config for the Python service.
# Deploy from the repo root: fly deploy --config fly.python.toml
app = "ehr-sync-python"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.python"

[env]
  # PYTHON_PORT is intentionally NOT set here: Dockerfile.python's CMD hardcodes the internal
  # port to 8000 regardless, so setting it would be dead weight implying configurability that
  # doesn't exist. `http_service.internal_port` below is the single source of truth for this port.
  # DATABASE_URL is set as a Fly secret.

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  interval = "15s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
