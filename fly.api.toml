# Fly.io app config for the Node API service.
# Deploy from the repo root: fly deploy --config fly.api.toml
app = "ehr-sync-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.api"

[env]
  NODE_ENV = "production"
  # API_PORT is intentionally NOT set here: apps/api reads it via config/env.ts and would bind to
  # whatever value this holds, so it must always match `http_service.internal_port` below exactly.
  # Leaving it unset lets the app fall back to its own default (3000), with `internal_port` as the
  # single source of truth for that port instead of two values that have to be kept in sync.
  # PYTHON_SERVICE_URL and DATABASE_URL are set as Fly secrets/env per environment
  # (they point at the deployed ehr-sync-python app and managed Postgres respectively).

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  interval = "15s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
